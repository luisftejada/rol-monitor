# One-command dev startup. Uses official base images with bind mounts and
# installs dependencies on first boot, so no Dockerfiles are needed yet.
#   docker compose up
services:
  backend:
    image: python:3.14-slim
    working_dir: /app
    command: >
      bash -c "pip install --no-cache-dir poetry &&
               poetry install &&
               poetry run uvicorn pf_tracker.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      PF_CORS_ORIGINS: '["http://localhost:5173"]'
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"

  frontend:
    image: node:24-slim
    working_dir: /app
    command: bash -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
