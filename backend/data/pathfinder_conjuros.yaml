meta:
  titulo: Pathfinder, juego de rol — Reglas básicas (Core Rulebook)
  edicion: Pathfinder 1ª edición (compatible con d20 / OGL 1.0a)
  editorial_es: Devir Iberia (traducción española, incorpora fe de erratas 1.4)
  licencia: La mecánica de juego está designada por Paizo como Contenido abierto (Open Game Content) bajo
    la Open Game License 1.0a. La Identidad de producto (nombres propios, ilustraciones, tramas, marcas)
    NO es contenido abierto.
  contenido: Cabeceras mecánicas de los conjuros del capítulo 10 (págs. 238-371). No incluye el texto
    descriptivo de cada conjuro.
  total_conjuros: 623
  fichero_hermano: pathfinder_nucleo.yaml
  campos:
    nombre: nombre del conjuro
    escuela: escuela de magia
    subescuela: subescuela, si la tiene
    descriptores: descriptores entre corchetes en el manual
    niveles: mapa clase -> nivel de conjuro
    lanzamiento: tiempo de lanzamiento
    componentes: V/S/M/F/FD/PX
    alcance: alcance del conjuro
    diana: objetivo, efecto o área
    duracion: duración
    salvacion: tirada de salvación
    rc: resistencia a conjuros
