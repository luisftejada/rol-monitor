  - legal
  - caótico
  componentes:
    V: verbal
    S: somático
    M: material
    F: foco
    FD: foco divino
    PX: coste en puntos de experiencia
  niveles_de_conjuro: 0 (trucos) a 9
  cd_salvacion: CD = 10 + nivel del conjuro + modificador de la característica de lanzamiento
  conjuros_extra_por_caracteristica: Se obtienen espacios adicionales por nivel de conjuro según el modificador
    de la característica de lanzamiento; se necesita puntuación >= 10 + nivel del conjuro para poder lanzarlo
  concentracion:
    formula: 1d20 + nivel de lanzador + mod. de la característica de lanzamiento
    cd_danyo: 10 + daño sufrido + nivel del conjuro
    cd_defensiva: 15 + doble del nivel del conjuro
    cd_apresado: 10 + BMC del apresador + nivel del conjuro
    cd_enmaranado: 15 + nivel del conjuro
  resistencia_a_conjuros: El lanzador tira 1d20 + nivel de lanzador contra el valor de RC del objetivo
  tipos_de_aptitud:
    Ex: 'extraordinaria: no mágica, no se puede disipar, funciona en campos antimagia, no sujeta a RC'
    Sb: 'sobrenatural: mágica pero no es conjuro; no provoca AdO; falla en campo antimagia; no sujeta
      a RC'
    Sy: 'sortílega: funciona como conjuro; provoca AdO; sujeta a RC y a contraconjuro'
  lanzamiento:
    preparados: mago, clérigo, druida, explorador y paladín preparan conjuros tras descansar 8 horas
    espontaneos: bardo y hechicero lanzan cualquier conjuro conocido usando un espacio del nivel adecuado
    descanso_necesario: 8 horas de descanso + tiempo de preparación (1 hora para preparados)
  contraconjurar: Se prepara una acción; identificar el conjuro con Conocimiento de conjuros CD 15 + nivel;
    anularlo con el mismo conjuro o con disipar magia
  alcances:
    personal: el propio lanzador
    toque: toque
    corto: 25 pies + 5 pies / 2 niveles
    medio: 100 pies + 10 pies / nivel
    largo: 400 pies + 40 pies / nivel
