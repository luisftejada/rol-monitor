  - nombre: Puñetazo aturdidor
    tipos:
    - Combate
    prerrequisitos: Des 13, Sab 13, Impacto sin arma mejorado, ataque base +8
    beneficio_resumen: debes declarar que usas esta dote antes de la tirada de ataque, por lo que un ataque
      fallido arruina el intento. Si impactas, el objetivo queda aturdido 1 asalto salvo que supere una
      salvación de Fortaleza (CD 10 + 1/2 tu nivel de personaje + tu modificador por Sabiduría). Puedes
      usarla una vez por asalto, y al día 1 vez por cada 4 niveles de personaje (los monjes, 1 vez por
      nivel de monje).
    activacion: declarada_antes_del_ataque
    efectos:
    - condicion: null
      modificadores: []
      reglas:
      - Debes declarar su uso antes de la tirada de ataque; un ataque fallido desperdicia el intento.
      - Si impactas, el objetivo debe superar una salvación de Fortaleza (CD 10 + 1/2 tu nivel de personaje
        + tu modificador por Sabiduría) o quedar aturdido durante 1 asalto.
      - Puedes usarla una vez por asalto y un número de veces al día igual a 1 por cada 4 niveles de personaje
        (los monjes pueden usarla 1 vez por nivel de monje).
      - Un personaje aturdido deja caer lo que tenga en las manos, no puede actuar, pierde su bonificador
        por Destreza a la CA y sufre un penalizador -2 a la CA.
      - Constructos, cienos, plantas, muertos vivientes, criaturas incorpóreas y criaturas inmunes a los
        impactos críticos no pueden quedar aturdidos.
      - 'Especial: un monje obtiene esta dote a 1er nivel aunque no cumpla los prerrequisitos, y puede
        usarla tantas veces al día como su nivel de monje, más 1 vez/día por cada 4 niveles en otras clases.'
