  lista:
  - nombre: Abstención de materiales
    tipos:
    - General
    prerrequisitos: null
    beneficio_resumen: puedes lanzar cualquier conjuro que tenga un componente material que cueste 1 po
      o menos, sin necesitar dicho componente.
    activacion: pasiva
    efectos:
    - condicion: null
      modificadores: []
      reglas:
      - Puedes lanzar cualquier conjuro con componente material de coste 1 po o menos sin necesitar dicho
        componente.
      - No afecta a componentes materiales de coste superior a 1 po ni a focos que cuesten más de 1 po.
  - nombre: Acometer
    tipos:
    - Combate
    prerrequisitos: ataque base +6
    beneficio_resumen: puedes aumentar el alcance de tus ataques cuerpo a cuerpo en 5 pies (1,5 m) hasta
      el final de tu turno aceptando un penalizador -2 a tu CA hasta el inicio de tu siguiente turno.
      Debes decidirlo antes de tirar ningún ataque.
    activacion: libre_declarada_antes_de_atacar
    efectos:
    - condicion: null
      modificadores:
      - objetivo: alcance_cuerpo_a_cuerpo
        tipo: sin_tipo
        valor: 5
      - objetivo: ca
        tipo: penalizador
        valor: -2
      reglas:
      - El aumento de alcance dura hasta el final de tu turno; el penalizador a la CA dura hasta el inicio
        de tu siguiente turno.
      - Debes decidir usar esta dote antes de llevar a cabo ninguna tirada de ataque.
  - nombre: Acrobático
    tipos:
    - General
    prerrequisitos: null
    beneficio_resumen: obtienes un bonificador +2 a las pruebas de Acrobacias y de Volar. Si tienes 10
      o más rangos en una de esas habilidades, el bonificador aumenta a +4 para dicha habilidad.
    activacion: pasiva
    efectos:
    - condicion: menos de 10 rangos en la habilidad
      cuando:
        rangos_habilidad:
          max: 9
      modificadores:
      - objetivo: prueba_habilidad.Acrobacias
        tipo: sin_tipo
        valor: 2
      - objetivo: prueba_habilidad.Volar
        tipo: sin_tipo
        valor: 2
      reglas: []
    - condicion: 10 o más rangos en la habilidad
      cuando:
        rangos_habilidad:
          min: 10
      modificadores:
      - objetivo: prueba_habilidad.Acrobacias
        tipo: sin_tipo
        valor: 4
      - objetivo: prueba_habilidad.Volar
        tipo: sin_tipo
        valor: 4
      reglas:
      - El aumento a +4 se aplica de forma independiente a cada habilidad, sólo en aquella en la que tengas
        10 o más rangos.
      - Sustituye al bonificador +2; no se apila con él.
  - nombre: Afinidad con los animales
    tipos:
    - General
    prerrequisitos: null
    beneficio_resumen: obtienes un bonificador +2 a las pruebas de Montar y de Trato con animales. Si
      tienes 10 o más rangos en una de esas habilidades, el bonificador aumenta a +4 para dicha habilidad.
    activacion: pasiva
    efectos:
