combate:
  pagina: 176
  iniciativa: '1d20 + modificador por Des (+ otros); se actúa en orden descendente. Empates: gana el mayor
    mod. de Des.'
  clase_de_armadura:
    formula: CA = 10 + bonif. armadura + bonif. escudo + mod. Des (limitado por máx. Des) + mod. tamaño
      + mod. natural + esquiva + otros
    ca_toque: Excluye armadura, escudo y armadura natural
    ca_desprevenido: Excluye Des y esquiva
  ataque:
    cuerpo_a_cuerpo: 1d20 + BAB + mod. Fue + mod. tamaño + otros
    a_distancia: 1d20 + BAB + mod. Des + mod. tamaño + penalizador por alcance + otros
    ataques_multiples: Con BAB +6 o más se obtiene un ataque adicional por cada -5 en una acción de ataque
      completo
    critico: Un resultado dentro del rango de amenaza obliga a confirmar con una segunda tirada de ataque;
      si impacta, se multiplica el daño
    danyo_minimo: Un impacto siempre inflige al menos 1 punto de daño
    toque: Los ataques de toque ignoran armadura, escudo y armadura natural
  tipos_de_accion:
  - tipo: estándar
    notas: atacar, lanzar la mayoría de conjuros, activar objetos
  - tipo: de movimiento
    notas: moverse hasta la velocidad, levantarse, desenvainar
  - tipo: de asalto completo
    notas: ataque completo, carga (movimiento+ataque)
  - tipo: gratuita
    notas: hablar, soltar un objeto; número razonable por asalto
  - tipo: rápida
    notas: una por asalto
  - tipo: inmediata
    notas: puede usarse fuera del propio turno; consume la acción rápida del turno siguiente
  - tipo: paso de 5 pies
    notas: no provoca AdO; incompatible con cualquier otro movimiento en el asalto
  acciones_comunes:
    cargar: 'Movimiento en línea recta de al menos 10 pies y un ataque: +2 al ataque, -2 a la CA hasta
      el siguiente turno'
    retirarse: Acción de asalto completo; el primer cuadrado de movimiento no provoca AdO
    defensa_total: +4 esquiva a la CA hasta el siguiente turno; no se puede atacar
    luchar_a_la_defensiva: -4 al ataque, +2 esquiva a la CA
    combate_con_dos_armas: -6/-6 al ataque (-4/-4 si el arma secundaria es ligera); la dote correspondiente
      reduce a -2/-2
  ataques_de_oportunidad:
    cantidad_base: 1
    provocan:
    - moverse fuera de un espacio amenazado
    - lanzar un conjuro
    - usar la mayoría de habilidades
    - usar un objeto a distancia
    - atacar a distancia
    - beber una poción
    no_provocan:
    - paso de 5 pies
    - acciones rápidas/gratuitas (por lo general)
    - retirada (primer cuadrado)
  maniobras:
    bmc: BMC = BAB + mod. Fue + mod. especial por tamaño
    dmc: DMC = 10 + BAB + mod. Fue + mod. Des + mod. especial por tamaño
    resolucion: 1d20 + BMC contra el DMC del defensor
    lista:
    - apresar
    - arrollar
    - derribar
    - desarmar
    - embestir
    - empujar
    - reposicionar
    - romper arma/objeto
    - finta (usa Engañar, no BMC)
  modificadores_de_combate:
    flanqueo: +2 al ataque cuerpo a cuerpo
    objetivo_tumbado: +4 al ataque cuerpo a cuerpo, -4 a distancia
    objetivo_indefenso: +4 al ataque cuerpo a cuerpo; permite golpe de gracia
    atacante_invisible: +2 al ataque; el defensor pierde su bonif. por Des
    cobertura: '+4 a la CA y +2 a Reflejos (cobertura mejorada: +8/+4)'
    ocultacion: '20% de fallo (ocultación total: 50%)'
    golpe_de_gracia: 'Acción de asalto completo contra objetivo indefenso: crítico automático; salvación
      Fort CD 10 + daño o muerte'
  heridas_y_muerte:
    0_pg: 'Incapacitado: una sola acción estándar o de movimiento por asalto'
    pg_negativos: Moribundo e inconsciente; prueba de Con CD 10 (con penalizador igual a los pg negativos)
      cada turno para estabilizarse
    muerte: Al llegar a pg negativos iguales a la puntuación de Constitución
    danyo_no_letal: Cuando iguala a los pg actuales el personaje queda grogui; si los excede, inconsciente
    curacion_natural: 1 pg por nivel de personaje tras 8 h de descanso; el doble con descanso completo
    estabilizar: Prueba de Curar CD 15 como acción estándar
  movimiento:
    velocidades_base:
    - 15
    - 20
    - 30
    - 40
    accion_de_movimiento: hasta la velocidad
    correr: ×4 la velocidad (×3 con armadura pesada), en línea recta, pierde Des a la CA
    terreno_dificil: cuesta el doble de movimiento
    carga_maxima_asalto: ×2 la velocidad como acción de asalto completo
