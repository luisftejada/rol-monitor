estados:
- nombre: Apresado
  efecto: 'Inmovilizado por otra criatura o efecto: -4 Des, -2 a ataques y maniobras (salvo apresar/escapar),
    no puede usar acciones a dos manos ni AdO; concentración CD 10 + BMC + nivel para lanzar.'
- nombre: Asustado
  efecto: Huye del origen del miedo si puede; -2 a ataques, salvaciones y pruebas.
- nombre: Aterrado
  efecto: 'Helado de miedo: no puede actuar, -2 a la CA y pierde el bonificador por Des.'
- nombre: Atontado
  efecto: No puede llevar a cabo acción alguna, pero no sufre penalizador a la CA. Suele durar 1 asalto.
- nombre: Aturdido
  efecto: Suelta lo que lleva, no puede actuar, -2 a la CA y pierde el bonificador por Des.
- nombre: Cegado
  efecto: 'No ve: -2 a la CA, pierde el bonificador por Des, -4 a la mayoría de pruebas de Fue/Des y a
    Percepción enfrentada; los enemigos tienen ocultación total; media velocidad.'
- nombre: Confuso
  efecto: No distingue amigos de enemigos; su comportamiento cada asalto se determina en una tabla aleatoria;
    si es atacado responde contra el atacante.
- nombre: Deslumbrado
  efecto: -1 a las tiradas de ataque y a las pruebas de Percepción basadas en la vista.
- nombre: Despavorido
  efecto: Suelta lo que lleva y huye en dirección aleatoria; -2 a salvaciones y pruebas; si se ve acorralado
    pasa a aterrado. Miedo más severo que estremecido o asustado.
- nombre: Desprevenido
  efecto: 'Antes de actuar en combate: pierde el bonificador por Des a la CA y no puede hacer AdO.'
- nombre: Energía consumida
  efecto: Uno o más niveles negativos; si iguala o supera sus DG, muere.
- nombre: Enmarañado
  efecto: Media velocidad, no puede correr ni cargar; -2 a ataques y -4 a Des; concentración CD 15 + nivel
    para lanzar conjuros.
- nombre: Ensordecido
  efecto: -4 a iniciativa, falla las pruebas de Percepción basadas en el oído y 20% de fallo al lanzar
    conjuros con componente verbal.
- nombre: Estable
  efecto: Deja de perder pg estando por debajo de 0; sigue inconsciente. Prueba de Con CD 10 cada hora
    para recuperar la consciencia y pasar a incapacitado.
- nombre: Estremecido
  efecto: -2 a ataques, salvaciones y pruebas de habilidad y de característica. Miedo menos severo.
- nombre: Exhausto
  efecto: Media velocidad, -6 a Fue y Des. Tras 1 hora de descanso pasa a fatigado.
- nombre: Fascinado
  efecto: Se queda quieto atendiendo al efecto; -4 a las pruebas de habilidad hechas como reacción; una
    amenaza potencial permite nueva salvación y una obvia rompe el efecto.
- nombre: Fatigado
  efecto: No puede correr ni cargar; -2 a Fue y Des. Se recupera con 8 horas de descanso. Fatigarse de
    nuevo lleva a exhausto.
- nombre: Grogui
  efecto: 'Daño no letal exactamente igual a los pg actuales: sólo una acción estándar o de movimiento
    por asalto (no ambas).'
- nombre: Incapacitado
  efecto: '0 pg (o negativos pero estabilizado y consciente): una sola acción estándar o de movimiento
    por asalto y media velocidad; una acción estándar agrava las heridas.'
- nombre: Inconsciente
  efecto: Tumbado e indefenso. Por pg negativos o por daño no letal superior a los pg actuales.
- nombre: Incorporal
  efecto: 'Sin cuerpo físico: inmune a ataques no mágicos, mitad de daño de armas mágicas, conjuros y
    efectos Sb/Sy; daño completo de efectos de fuerza y otras criaturas incorporales.'
- nombre: Indefenso
  efecto: Se considera Des 0 (mod. -5); los ataques cuerpo a cuerpo obtienen +4 y permiten golpe de gracia.
- nombre: Indispuesto
  efecto: -2 a todas las tiradas de ataque, daño, salvaciones y pruebas de habilidad y de característica.
- nombre: Invisible
  efecto: 'Visualmente indetectable: +2 a las tiradas de ataque contra oponentes con vista, que además
    pierden su bonificador por Des a la CA.'
- nombre: Mareado
  efecto: No puede atacar, lanzar conjuros ni concentrarse; sólo una acción de movimiento por turno.
- nombre: Moribundo
  efecto: Inconsciente con pg negativos y sin estabilizar; prueba de Con CD 10 (penalizada por los pg
    negativos) cada turno o pierde 1 pg.
- nombre: Muerto
  efecto: pg negativos iguales a la Constitución, Con reducida a 0 o efecto de muerte. Sólo la magia puede
    devolverlo a la vida.
- nombre: Paralizado
  efecto: Fue y Des efectivas 0, indefenso, sólo acciones mentales; una criatura voladora cae.
- nombre: Petrificado
  efecto: Convertido en piedra; se considera inconsciente. Los trozos perdidos causan daño permanente
    al volver a la carne.
- nombre: Roto
  efecto: 'Objeto con más de la mitad de sus pg perdidos: armas -2 al ataque y al daño y sólo crítico
    ×2 con 20 natural; armaduras y escudos dan la mitad del bonificador; herramientas -2; varitas y bastones
    gastan doble carga; valor 75%.'
- nombre: Sangrando
  efecto: Sufre el daño indicado al inicio de cada turno; se detiene con Curar CD 15 o con cualquier conjuro
    que cure pg.
- nombre: Sujeto
  efecto: 'Versión severa de apresado: no puede moverse, pierde el bonificador por Des y sufre -4 adicional
    a la CA; no puede lanzar con componentes somáticos o materiales.'
- nombre: Tumbado
  efecto: -4 a las tiradas de ataque cuerpo a cuerpo; +4 a la CA contra ataques a distancia y -4 contra
    cuerpo a cuerpo. Levantarse es una acción de movimiento que provoca AdO.
