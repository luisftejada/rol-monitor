    bonificador_de_clase: +3 a una habilidad de clase en la que se tenga al menos 1 rango
    formula: 1d20 + rangos + mod. característica + mod. racial + (+3 si es habilidad de clase con rangos)
    ayudar_a_otro: prueba CD 10 para dar +2 al aliado
