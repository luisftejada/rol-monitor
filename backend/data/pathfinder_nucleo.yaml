        tipo: sin_tipo
        valor: accion_gratuita
      reglas: []
    - condicion: ballesta pesada
      modificadores:
      - objetivo: tiempo_recarga
        tipo: sin_tipo
        valor: accion_de_movimiento
      reglas: []
    - condicion: null
      modificadores: []
      reglas:
      - Recargar una ballesta SIGUE provocando ataques de oportunidad.
      - Si escogiste ballesta de mano o ligera, puedes dispararla tantas veces en una acción de ataque
        completo como si usaras un arco.
      - Puedes tomar esta dote varias veces, eligiendo un tipo de ballesta distinto.
    nota_datos: 'CORRECCIÓN: una versión previa afirmaba que recargar no provoca ataques de oportunidad;
      el manual dice lo contrario (pág. 135).'
