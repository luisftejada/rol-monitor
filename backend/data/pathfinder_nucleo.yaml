        rangos_habilidad:
          max: 9
      modificadores:
      - objetivo: prueba_habilidad.Montar
        tipo: sin_tipo
        valor: 2
      - objetivo: prueba_habilidad.Trato con animales
        tipo: sin_tipo
        valor: 2
      reglas: []
    - condicion: 10 o más rangos en la habilidad
      cuando:
        rangos_habilidad:
          min: 10
      modificadores:
      - objetivo: prueba_habilidad.Montar
        tipo: sin_tipo
        valor: 4
      - objetivo: prueba_habilidad.Trato con animales
        tipo: sin_tipo
        valor: 4
      reglas:
      - El aumento a +4 se aplica de forma independiente a cada habilidad, sólo en aquella en la que tengas
        10 o más rangos.
      - Sustituye al bonificador +2; no se apila con él.
  - nombre: Aguante
    tipos:
    - General
    prerrequisitos: null
    beneficio_resumen: 'obtienes un bonificador +4 a las siguientes pruebas y salvaciones: pruebas de
      Nadar para resistir daño no letal por cansancio; pruebas de Constitución para continuar corriendo;
      pruebas de Constitución para evitar daño no letal por marcha forzada; pruebas de Constitución para
      contener la respiración; pruebas de Constitución para evitar daño no letal por hambre o sed; salvaciones
      de Fortaleza para evitar daño no letal por entorno caluroso o frío; y salvaciones de Fortaleza para
      resistir el daño por asfixia. Además puedes dormir con armadura ligera o intermedia sin quedar fatigado.'
    activacion: pasiva
    efectos:
    - condicion: pruebas y salvaciones por fatiga y privación
      modificadores:
      - objetivo: prueba_habilidad.Nadar
        tipo: sin_tipo
        valor: 4
      - objetivo: prueba_caracteristica.Constitucion
        tipo: sin_tipo
        valor: 4
      - objetivo: salvacion_fortaleza
        tipo: sin_tipo
        valor: 4
      reglas:
      - 'El +4 se aplica a: pruebas de Nadar para resistir daño no letal por cansancio; pruebas de Constitución
        para continuar corriendo; pruebas de Constitución para evitar daño no letal por marcha forzada;
        pruebas de Constitución para contener la respiración; pruebas de Constitución para evitar daño
        no letal por hambre o sed; salvaciones de Fortaleza para evitar daño no letal por entornos calurosos
        o fríos; y salvaciones de Fortaleza para resistir el daño por asfixia.'
      - 'No es un bonificador general a Nadar, Constitución ni Fortaleza: aplícalo sólo en los casos listados.'
    - condicion: null
      modificadores: []
      reglas:
      - Puedes dormir con armadura ligera o intermedia sin quedar fatigado.
  - nombre: Alerta
    tipos:
    - General
    prerrequisitos: null
    beneficio_resumen: obtienes un bonificador +2 a las pruebas de Percepción y de Averiguar intenciones.
      Si tienes 10 o más rangos en una de esas habilidades, el bonificador aumenta a +4 para dicha habilidad.
    activacion: pasiva
    efectos:
    - condicion: menos de 10 rangos en la habilidad
      cuando:
        rangos_habilidad:
          max: 9
      modificadores:
      - objetivo: prueba_habilidad.Percepción
        tipo: sin_tipo
        valor: 2
      - objetivo: prueba_habilidad.Averiguar intenciones
        tipo: sin_tipo
        valor: 2
      reglas: []
    - condicion: 10 o más rangos en la habilidad
      cuando:
        rangos_habilidad:
          min: 10
      modificadores:
      - objetivo: prueba_habilidad.Percepción
        tipo: sin_tipo
        valor: 4
      - objetivo: prueba_habilidad.Averiguar intenciones
        tipo: sin_tipo
        valor: 4
      reglas:
      - El aumento a +4 se aplica de forma independiente a cada habilidad, sólo en aquella en la que tengas
        10 o más rangos.
      - Sustituye al bonificador +2; no se apila con él.
  - nombre: Ampliar conjuro
    tipos:
    - Metamágica
    prerrequisitos: null
    beneficio_resumen: puedes alterar un conjuro con un alcance de cercano, medio, o largo para incrementar
      su alcance en un 100%.
    activacion: metamagica
    efectos:
    - condicion: null
      modificadores:
      - objetivo: nivel_conjuro
        tipo: sin_tipo
        valor: 1
      - objetivo: alcance_conjuro
        tipo: multiplicador
        valor: x2
      reglas:
      - Sólo afecta a conjuros de alcance cercano, medio o largo.
      - No afecta a conjuros de alcance personal, toque o alcance fijo.
      - 'Alcance cercano ampliado: 50 pies + 5 pies/nivel (15 m + 1,5 m/nivel).'
      - 'Alcance medio ampliado: 200 pies + 20 pies/nivel (60 m + 6 m/nivel).'
      - 'Alcance largo ampliado: 800 pies + 80 pies/nivel (240 m + 24 m/nivel).'
  - nombre: Apresurar conjuro
    tipos:
    - Metamágica
    prerrequisitos: null
    beneficio_resumen: lanzar un conjuro apresurado es una acción rápida.
    activacion: metamagica
    efectos:
    - condicion: null
      modificadores:
      - objetivo: nivel_conjuro
        tipo: sin_tipo
        valor: 4
      reglas:
      - Lanzar el conjuro apresurado pasa a ser una acción rápida.
      - Sólo puedes lanzar un conjuro rápido por asalto.
      - No puedes apresurar un conjuro cuyo tiempo de lanzamiento sea superior a 1 asalto completo.
  - nombre: Aptitudes mágicas
    tipos:
    - General
    prerrequisitos: null
    beneficio_resumen: obtienes un bonificador +2 a las pruebas de Conocimiento de conjuros y de Usar
      objeto mágico. Si tienes 10 o más rangos en una de esas habilidades, el bonificador aumenta a +4
      para dicha habilidad.
    activacion: pasiva
    efectos:
