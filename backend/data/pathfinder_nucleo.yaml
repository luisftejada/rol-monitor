        m) o menos.
      - Cada objetivo puede negar el efecto con una salvación de Voluntad (CD 10 + la mitad de tu nivel
        de clérigo + tu modificador por Carisma).
      - Los que fallan quedan bajo tu control como si estuvieran bajo los efectos de controlar muertos
        vivientes, sin duración limitada.
      - Los muertos vivientes inteligentes obtienen una nueva salvación cada día para resistirse a tus
        órdenes.
      - Puedes controlar cualquier número de muertos vivientes mientras la suma de sus Dados de Golpe
        no exceda tu nivel de clérigo.
      - Si un muerto viviente ya está controlado por otra criatura, se resuelve con una prueba enfrentada
        de Carisma cuando las órdenes entren en conflicto.
      - Usada así, la canalización no tiene ningún otro efecto.
