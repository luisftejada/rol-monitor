    beneficio_resumen: 'como acción estándar, llevas a cabo un solo ataque a distancia: el objetivo no
      puede aplicar a su Clase de armadura ningún bonificador por armadura, armadura natural o escudo.
      No obtienes el beneficio de esta dote si te mueves durante el asalto.'
