        valor: 2
      - objetivo: efectos_variables_conjuro
        tipo: multiplicador
        valor: x1.5
      reglas:
      - Todos los efectos variables y numéricos del conjuro aumentan en la mitad (+50%).
      - No afecta a las tiradas de salvación ni a los efectos que no sean variables y numéricos.
    nota_datos: 'CORRECCIÓN: la extracción original asignaba a esta dote el tipo (General), el prerrequisito
      (ataque base +6) y el texto de Acometer, por contaminación de columna en el PDF. Restaurados los
      datos de Potenciar conjuro (Empower Spell): Metamágica, sin prerrequisitos.'
