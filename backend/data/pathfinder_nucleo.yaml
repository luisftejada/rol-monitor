sistema:
  dado_principal: d20
  resolucion_basica: 1d20 + modificadores >= CD (Clase de Dificultad) o >= CA del objetivo
  notacion_dados: XdY[+Z]; 'd%' = d100
  redondeo: Salvo indicación contraria, las fracciones se redondean hacia abajo (incluso por debajo de
    1).
  multiplicadores: 'Multiplicadores acumulados se suman como incrementos, no se multiplican entre sí:
    ×2 y ×2 = ×3 (se suma 1 por cada multiplicador adicional).'
  20_natural: Un 20 natural en una tirada de ataque siempre impacta y amenaza crítico; en una salvación
    siempre es éxito.
  1_natural: Un 1 natural en una tirada de ataque siempre falla; en una salvación siempre es fallo.
  elegir_10:
    descripcion: Sin peligro ni distracción, se puede tomar 10 en lugar de tirar 1d20.
    resultado: 10 + modificadores
  elegir_20:
    descripcion: Sin amenaza, sin límite de tiempo y sin penalización por fallo, se puede tomar 20.
    resultado: 20 + modificadores
    coste_tiempo: 20 veces el tiempo de una prueba normal
  tipos_de_bonificador:
    nota: Bonificadores del mismo tipo NO se apilan (se aplica el mayor), salvo los sin tipo, los de esquiva
      y las circunstancias distintas.
    apilan_siempre:
    - sin tipo
    - esquiva
    - circunstancia (de fuentes distintas)
    no_apilan:
    - alquimia
    - armadura
    - armadura natural
    - competencia
    - escudo
    - inherente
    - introspección
    - moral
    - potenciador
    - profano
    - racial
    - resistencia
    - sagrado
    - suerte
    - tamaño
    penalizadores: Los penalizadores se apilan siempre, salvo los debidos al mismo efecto concreto.
  unidades:
    casilla: 5 pies (1,5 m)
    asalto: 6 segundos
    minuto: 10 asaltos
    hora: 600 asaltos
  terminos_clave:
    CD: Clase de Dificultad
    CA: Clase de armadura
    DG: Dados de golpe
    pg: puntos de golpe
    PX: puntos de experiencia
    VD: Valor de desafío
    NL: Nivel de lanzador
    BMC: Bonificador de maniobras de combate
    DMC: Defensa contra maniobras de combate
    AdO: Ataque de oportunidad
    RD: Reducción del daño
    RC: Resistencia a conjuros
    po/pp/pc/ppt: pieza de oro / plata / cobre / platino
caracteristicas:
  lista:
  - nombre: Fuerza
    abrev: Fue
    usos: tiradas de ataque y daño cuerpo a cuerpo, BMC/DMC, Trepar, Nadar, capacidad de carga
  - nombre: Destreza
    abrev: Des
    usos: CA, ataques a distancia, iniciativa, salvación de Reflejos, Acrobacias, Sigilo
  - nombre: Constitución
    abrev: Con
    usos: puntos de golpe por DG, salvación de Fortaleza, concentración
  - nombre: Inteligencia
    abrev: Int
    usos: rangos de habilidad por nivel, idiomas, conjuros de mago
  - nombre: Sabiduría
    abrev: Sab
    usos: salvación de Voluntad, Percepción, conjuros de clérigo/druida/explorador
  - nombre: Carisma
    abrev: Car
    usos: habilidades sociales, canalizar energía, conjuros de bardo/hechicero/paladín
  modificador: modificador = (puntuación - 10) // 2 (división entera hacia abajo)
  puntuacion_0: Una puntuación de 0 en cualquier característica deja al personaje incapacitado o inconsciente;
    Con 0 = muerte.
  metodos_de_generacion:
  - nombre: Compra de puntos
    detalle: Se parte de 10 en todas y se gastan puntos según coste creciente; 15 puntos = campaña estándar,
      20 = épica, 25 = heroica
  - nombre: Clásico
    detalle: 3d6 seis veces, asignados en orden
  - nombre: Estándar
    detalle: 4d6, descartar el dado más bajo, seis veces, asignación libre
  - nombre: Heroico
    detalle: 2d6+6, seis veces, asignación libre
  - nombre: Dados y asignación
    detalle: 3d6 seis veces, asignación libre
  coste_compra_puntos:
    7: -4
    8: -2
    9: -1
    10: 0
    11: 1
    12: 2
    13: 3
    14: 5
    15: 7
    16: 10
    17: 13
    18: 17
  incrementos_por_nivel: +1 a una característica a elección en los niveles 4, 8, 12, 16 y 20
