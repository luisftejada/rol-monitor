        m) o menos.
      - Cada objetivo puede llevar a cabo una salvación de Voluntad (CD 10 + 1/2 tu nivel de clase + tu
        modificador por Carisma) para negar el efecto.
      - Los que fallan huyen durante 1 minuto; si no pueden huir, quedan acobardados.
      - Los muertos vivientes inteligentes tienen derecho a una nueva salvación cada asalto para acabar
        el efecto.
      - 'Usada así, la canalización no tiene ningún otro efecto: no cura ni daña a las criaturas cercanas.'
      - El manual imprime «30 pies (4,5 m)»; la conversión correcta de 30 pies es 9 m.
