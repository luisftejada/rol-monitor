    beneficio_resumen: el tiempo necesario para recargar el tipo de ballesta escogido se reduce a una
      acción gratuita (ballesta de mano o ligera) o a una acción de movimiento (ballesta pesada). Recargar
      una ballesta sigue provocando ataques de oportunidad. Con una ballesta de mano o ligera puedes disparar
      tantas veces en una acción de ataque completo como si usaras un arco.
    activacion: pasiva
    efectos:
