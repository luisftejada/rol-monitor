      cuando:
        rangos_habilidad:
          max: 9
      modificadores:
      - objetivo: prueba_habilidad.Conocimiento de conjuros
        tipo: sin_tipo
        valor: 2
      - objetivo: prueba_habilidad.Usar objeto mágico
        tipo: sin_tipo
        valor: 2
      reglas: []
    - condicion: 10 o más rangos en la habilidad
      cuando:
        rangos_habilidad:
          min: 10
      modificadores:
      - objetivo: prueba_habilidad.Conocimiento de conjuros
        tipo: sin_tipo
        valor: 4
      - objetivo: prueba_habilidad.Usar objeto mágico
        tipo: sin_tipo
        valor: 4
      reglas:
      - El aumento a +4 se aplica de forma independiente a cada habilidad, sólo en aquella en la que tengas
        10 o más rangos.
      - Sustituye al bonificador +2; no se apila con él.
  - nombre: Arrollar mayor
    tipos:
    - Combate
    prerrequisitos: Arrollar mejorado, Ataque poderoso, ataque base +6, Fue 13
    beneficio_resumen: obtienes un bonificador +2 a las pruebas para arrollar a un enemigo, que se apila
      con el concedido por Arrollar mejorado. Cuando arrollas a un oponente, éste provoca ataques de oportunidad
      si queda tumbado por tu arrollamiento.
    activacion: pasiva
    efectos:
    - condicion: null
      modificadores:
      - objetivo: bmc_arrollar
        tipo: sin_tipo
        valor: 2
      reglas:
      - El bonificador +2 a la prueba se apila con el de Arrollar mejorado.
      - 'Esta dote NO concede bonificador al DMC: sólo Arrollar mejorado lo concede.'
      - Cuando arrollas a un oponente, éste provoca ataques de oportunidad si queda tumbado por tu arrollamiento.
    nota_datos: 'VERIFICADO CONTRA EL PDF. Atención al mapeo de la traducción de Devir: «Arrollar» es
      Overrun y «Embestida» es Bull rush, al contrario de lo que sugiere el parecido fonético.'
  - nombre: Arrollar mejorado
    tipos:
    - Combate
    prerrequisitos: Fue 13, Ataque poderoso, ataque base +1
    beneficio_resumen: no provocas ataques de oportunidad al llevar a cabo una maniobra de combate de
      arrollar. Además obtienes un bonificador +2 a las pruebas de arrollar y +2 a tu Defensa contra maniobras
      de combate cuando un oponente intenta arrollarte. Los objetivos de tus intentos de arrollar no pueden
      evitarte.
    activacion: pasiva
    efectos:
    - condicion: null
      modificadores:
      - objetivo: bmc_arrollar
        tipo: sin_tipo
        valor: 2
      - objetivo: dmc_vs_arrollar
        tipo: sin_tipo
        valor: 2
      reglas:
      - No provocas ataques de oportunidad al llevar a cabo una maniobra de combate de arrollar.
      - Los objetivos de tus intentos de arrollar no pueden evitarte.
    nota_datos: 'VERIFICADO CONTRA EL PDF. Atención al mapeo de la traducción de Devir: «Arrollar» es
      Overrun y «Embestida» es Bull rush, al contrario de lo que sugiere el parecido fonético.'
  - nombre: Artesano maestro
    tipos:
    - General
    prerrequisitos: 5 rangos en cualquier variedad de Artesanía o Profesión
    beneficio_resumen: 'escoge una variedad de Artesanía o de Profesión en la que tengas al menos 5 rangos:
      obtienes un bonificador +2 a sus pruebas y puedes usar sus rangos en lugar de un nivel de lanzador
      para cumplir los prerrequisitos de Fabricar armas y armaduras mágicas y de Fabricar objeto maravilloso.'
    activacion: pasiva
    efectos:
    - condicion: null
      modificadores:
      - objetivo: prueba_habilidad.Artesania_o_Profesion_elegida
        tipo: sin_tipo
        valor: 2
      reglas:
      - Escoge una variedad de Artesanía o de Profesión en la que tengas al menos 5 rangos.
      - Puedes usar rangos en esa habilidad en lugar de un nivel de lanzador para cumplir los prerrequisitos
        de Fabricar armas y armaduras mágicas y de Fabricar objeto maravilloso.
      - Puedes usar esa habilidad en lugar del conjuro requerido al fabricar un objeto mágico, aumentando
        en +5 la CD de la prueba.
  - nombre: Ataque al galope
    tipos:
    - Combate
    prerrequisitos: Montar 1 rango, Combatir desde una montura
    beneficio_resumen: cuando vas montado y utilizas la acción de cargar, puedes moverte y atacar como
      en una carga estándar y seguir moviéndote después del ataque. El movimiento total no puede superar
      el doble de la velocidad de tu montura, y ni tú ni ella provocáis ataques de oportunidad del oponente
      atacado.
    activacion: accion_de_carga_montado
    efectos:
    - condicion: null
      modificadores: []
      reglas:
      - Al cargar montado, puedes moverte y atacar como en una carga normal y continuar moviéndote después
        del ataque.
      - El movimiento total no puede superar el doble de la velocidad de la montura, y el ataque debe
        producirse en algún punto del recorrido.
      - Ni tú ni tu montura provocáis ataques de oportunidad del oponente atacado.
  - nombre: Ataque de torbellino
    tipos:
    - Combate
    prerrequisitos: Des 13, Int 13, Pericia en combate, Esquiva, Movilidad, Ataque elástico, ataque base
      +4
    beneficio_resumen: cuando utilizas la acción de ataque completo, puedes cambiar tus ataques normales
      por un ataque cuerpo a cuerpo a tu ataque base más alto contra cada oponente a tu alcance. Debes
      atacar a todos ellos y no obtienes ataques adicionales por ataque base, aptitudes ni conjuros.
    activacion: asalto_completo
    efectos:
    - condicion: null
      modificadores: []
      reglas:
      - En lugar de la acción de ataque completo, llevas a cabo un ataque cuerpo a cuerpo a tu ataque
        base más alto contra cada oponente a tu alcance.
      - Debes atacar a todos los oponentes a tu alcance; no puedes escoger objetivos.
      - No obtienes ataques adicionales por ataque base alto, aptitudes ni conjuros al usar esta dote.
  - nombre: Ataque elástico
    tipos:
    - Combate
    prerrequisitos: Des 13, Esquiva, Movilidad, ataque base +4
    beneficio_resumen: como acción de asalto completo, puedes moverte hasta tu velocidad y llevar a cabo
      un solo ataque cuerpo a cuerpo en cualquier punto del movimiento, sin provocar ataques de oportunidad
      por parte del oponente atacado. El resto de enemigos sí pueden atacarte por oportunidad con normalidad.
    activacion: asalto_completo
    efectos:
    - condicion: null
      modificadores: []
      reglas:
      - Como acción de asalto completo, te mueves hasta tu velocidad y llevas a cabo un solo ataque cuerpo
        a cuerpo en cualquier punto del movimiento.
      - El oponente atacado no obtiene ataques de oportunidad por tu movimiento.
      - El movimiento provoca ataques de oportunidad del resto de enemigos con normalidad.
      - Debes recorrer al menos 10 pies (3 m) antes del ataque.
      - La distancia total recorrida no puede superar tu velocidad.
  - nombre: Ataque poderoso
    tipos:
    - Combate
    prerrequisitos: Fue 13, ataque base +1
    beneficio_resumen: puedes elegir aceptar un penalizador a todas las tiradas de ataque cuerpo a cuerpo
