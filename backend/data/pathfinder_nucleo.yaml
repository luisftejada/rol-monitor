  - nombre: Duro de pelar
    tipos:
    - General
    prerrequisitos: Aguante
    beneficio_resumen: cuando tus puntos de golpe están por debajo de 0 pero no estás muerto, te estabilizas
      automáticamente y permaneces consciente y capaz de actuar en estado incapacitado. Cada acción estándar
      o de asalto completo te inflige 1 punto de daño adicional.
    activacion: pasiva
    efectos:
    - condicion: puntos de golpe por debajo de 0 pero no muerto
      cuando:
        puntos_de_golpe_actuales:
          max: -1
      modificadores: []
      reglas:
      - Te estabilizas automáticamente, sin necesidad de prueba de Constitución.
      - Permaneces consciente y puedes actuar, aunque en estado incapacitado (grogui).
      - Cada acción estándar o de asalto completo que lleves a cabo te inflige 1 punto de daño adicional.
      - Mueres igualmente si tus puntos de golpe llegan a un negativo igual a tu puntuación de Constitución.
      - Debes decidir actuar como incapacitado en cuanto quedes reducido a puntos de golpe negativos,
        incluso si no es tu turno; si no lo haces, quedas inconsciente de inmediato.
      - Puedes llevar a cabo una acción de movimiento sin causarte más heridas.
