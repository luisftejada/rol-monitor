  - nombre: Disparos múltiples
    tipos:
    - Combate
    prerrequisitos: Des 17, Disparo a bocajarro, Disparo rápido, ataque base +6
    beneficio_resumen: cuando llevas a cabo una acción de ataque completo con un arco, tu primer ataque
      dispara 2 f lechas y, si tiene éxito, ambas f lechas impactan.
    activacion: asalto_completo
    efectos:
    - condicion: null
      modificadores: []
      reglas:
      - En una acción de ataque completo con un arco, tu primer ataque dispara 2 flechas; si impacta,
        ambas flechas alcanzan al objetivo.
      - Tira el daño de cada flecha por separado; los bonificadores al daño se aplican a ambas.
      - El daño de precisión (como ataque furtivo) y el daño de crítico se aplican sólo a la primera flecha.
      - Los bonificadores al daño (arco compuesto por Fuerza, enemigo predilecto, etc.) se aplican a cada
        flecha.
      - La reducción de daño y las resistencias se aplican por separado a cada flecha.
