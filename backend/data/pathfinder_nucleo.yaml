      - No obtienes el beneficio de esta dote si te mueves durante el asalto.
    nota_datos: 'CORRECCIÓN: una versión previa exigía estar en el primer incremento de alcance e incluía
      los bonificadores por mejora; ninguna de las dos cosas aparece en el manual (pág. 134).'
