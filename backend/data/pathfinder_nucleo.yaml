  esquema_efectos:
    descripcion: Contrato de datos de `efectos`. Cada dote expone una lista de efectos; cada efecto tiene
      una condición (texto), un bloque `cuando` (predicado legible por máquina, opcional), una lista de
      `modificadores` numéricos, una lista de `sustituciones` (opcional) y una lista de `reglas` en texto
      para lo que no es un modificador.
    modificador:
      objetivo: valor derivado afectado; ver `objetivos`
      tipo: tipo de bonificador de Pathfinder; ver `tipos_bonificador`
      valor: entero con signo, o cadena para valores no escalares (multiplicadores, fórmulas, dados)
    tipos_bonificador:
      apilan_siempre:
      - sin_tipo
      - esquiva
      - penalizador
      no_apilan_consigo_mismos:
      - alquimico
      - circunstancia
      - competencia
      - deflexion
      - escudo
      - mejora
      - moral
      - natural
      - perspicacia
      - profano
      - resistencia
      - sagrado
      - suerte
      - tamano
      nota: Los bonificadores por circunstancia de fuentes distintas sí se apilan; los del mismo origen,
        no. Los penalizadores se apilan siempre.
