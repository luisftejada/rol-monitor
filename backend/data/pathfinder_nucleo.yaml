      ti, puedes dar tú también un paso de 5 pies como acción inmediata, siempre que acabes adyacente
      a él. Este paso no cuenta como parte de tu movimiento, pero no puedes dar otro paso de 5 pies antes
      del final de tu siguiente turno.
    activacion: inmediata
    efectos:
    - condicion: un enemigo adyacente da un paso de 5 pies alejándose de ti
      modificadores: []
      reglas:
      - Puedes dar un paso de 5 pies (1,5 m) como acción inmediata, siempre que acabes adyacente a ese
        enemigo.
      - Este paso no cuenta como parte de tu movimiento del asalto, pero no puedes dar otro paso de 5
        pies antes del final de tu siguiente turno.
      - Si durante tu siguiente turno llevas a cabo una acción de movimiento, resta 5 pies (1,5 m) de
        tu movimiento total.
