dotes:
  reglas:
    obtencion: una dote a 1er nivel y otra cada nivel impar; los guerreros y otros obtienen dotes adicionales
    tipos:
    - General
    - Combate
    - Metamágica
    - Creación de objeto
    - Crítico
    prerrequisitos: deben cumplirse siempre para usar la dote
    campos:
      beneficio_resumen: resumen en prosa del beneficio, sin truncar
      activacion: cómo se activa la dote (ver esquema_efectos.activacion)
      efectos: descomposición mecánica del beneficio; ver esquema_efectos
      nota_datos: presente sólo si la entrada se corrigió o reconstruyó respecto a la extracción original
        del PDF
    sinonimos_del_manual:
      descripcion: el capítulo de clases nombra algunas dotes de forma distinta a la Tabla 5-1 del capítulo
        de dotes. dotes.lista sigue el capítulo de dotes; esta tabla registra la equivalencia para poder
        auditar las listas de dotes_adicionales contra el capítulo de clases
      fuente_canonica: pág. 114
      equivalencias:
      - en_clases: Rasgadura doble
        canonico: Doble tajo
        donde: explorador, estilo de combate con dos armas
        fuente: pág. 56
      - en_clases: Arremetida con el escudo mejorada
        canonico: Golpear con el escudo mejorado
        donde: explorador, estilo de combate con dos armas
        fuente: pág. 56
      - en_clases: Desenfundado rápido
        canonico: Desenvainado rápido
        donde: explorador, estilo de combate con dos armas
        fuente: pág. 56
      - en_clases: Desgarro con dos armas
        canonico: Desgarrar con dos armas
        donde: explorador, estilo de combate con dos armas
        fuente: pág. 56
      - en_clases: Puntería extrema
        canonico: Puntería precisa
        donde: explorador, estilo de tiro con arco
        fuente: pág. 56
      - en_clases: Desarmar mejorado
        canonico: Desarme mejorado
        donde: hechicero, linaje infernal
        fuente: pág. 66
      - en_clases: Conjuros penetrantes
        canonico: Conjuros perforantes
        donde: hechicero, linaje infernal
        fuente: pág. 66
  listas_restringidas:
    estilo_de_combate_explorador:
      descripcion: dotes concedidas por la aptitud Dote de estilo de combate del explorador. A 2º nivel
        selecciona uno de los dos estilos (tiro con arco o combate con dos armas) y ya no puede cambiarlo;
        cada concesión posterior se escoge del mismo estilo
      nota: el explorador puede escoger estas dotes aunque carezca de sus prerrequisitos normales. Los
        beneficios sólo se aplican con armadura ligera, intermedia o sin armadura, y se pierden por completo
        con armadura pesada
      acumulativa: true
      nota_acumulacion: cada nivel indicado añade dotes a la lista, no la sustituye. Los niveles 14 y 18
        escogen de la lista acumulada a 10º
      opciones:
        tiro_con_arco:
          2:
          - Disparo a larga distancia
          - Disparo a bocajarro
          - Disparo preciso
          - Disparo rápido
          6:
          - Disparo preciso mejorado
          - Disparos múltiples
          10:
          - Puntería precisa
          - Disparo a la carrera
        combate_con_dos_armas:
          2:
          - Doble tajo
          - Golpear con el escudo mejorado
          - Desenvainado rápido
          - Combate con dos armas
          6:
          - Combate con dos armas mejorado
          - Defensa con dos armas
          10:
          - Combate con dos armas mayor
          - Desgarrar con dos armas
      fuente: pág. 55
    dotes_adicionales_monje:
      descripcion: dotes adicionales del monje; el manual acota las opciones por tramos de nivel, no por
        tipo de dote
      nota: el monje no necesita cumplir los prerrequisitos normales de estas dotes
      acumulativa: true
      nota_acumulacion: cada nivel indicado añade dotes a la lista, no la sustituye. Los niveles 14 y 18
        escogen de la lista acumulada a 10º
      opciones:
        1:
        - Usar arma improvisada
